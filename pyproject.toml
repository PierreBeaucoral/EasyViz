[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "easyviz"
version = "0.2.0"
description = "Academic-grade explorer for World Bank WDI and OWID indicators with reproducible code export."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Pierre Beaucoral" },
]
keywords = ["development", "economics", "world bank", "wdi", "owid", "streamlit", "plotly", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "rapidfuzz>=3.0.0",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "kaleido==0.2.1",       # pinned: only version that exports reliably with Plotly
    "openpyxl>=3.1.0",
    "pycountry>=23.12.11",
    "scipy>=1.11.0",        # Spearman, OLS fit
    "statsmodels>=0.14.0",  # LOESS / trend overlays
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/PierreBeaucoral/EasyViz"
Issues = "https://github.com/PierreBeaucoral/EasyViz/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]  # pytest fixture naming
